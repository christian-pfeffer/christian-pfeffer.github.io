<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MOSFET Querschnitt F4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: feste Bühne 3200×1280 (2,5:1), links ~60 % Querschnitt, rechts ~40 % Erklärung + Live-Kennlinie.
   Bewusst nur ein helles Thema: der Vortragsraum ist weiß und nicht abgedunkelt. */
:root{
  --paper:#F1F4F3;   /* leicht kühles Off-White, blendet weniger als Reinweiß */
  --ink:#15212C;
  --muted:#5A6672;
  --rule:#C5CDD2;
  --p-si:#AFC4E8;    /* p-Silizium (wie im Standardbild) */
  --p-depl:#E2EAF6;  /* Raumladungszone */
  --nplus:#EC8A3E;   /* n+ und Kanal */
  --oxide:#CDD2D6;
  --metal:#2A3037;
  --pin:#F2CC47;
  --electron:#0B2E73;
  --hole:#C23A2B;
  --accent:#C9501A;
  --f-sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-mono:"Helvetica Neue",Helvetica,Arial,sans-serif; /* Zahlen: gleiche Schrift, tabellarische Ziffern */
  color-scheme:light;
}
[hidden]{display:none!important}
.nw{white-space:nowrap}
html,body{height:100%}
body{font-variant-numeric:tabular-nums;margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-sans);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;box-sizing:border-box}
#viewport{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:3200px;height:1280px;transform-origin:0 0;background:var(--paper)}

/* Kopfzeile */
#head{position:absolute;left:90px;top:44px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--f-mono);font-size:30px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:84px;font-weight:600;letter-spacing:-.01em;line-height:1.05}

/* Querschnitt */
#xs{position:absolute;left:40px;top:140px;width:1900px;height:1100px;overflow:visible}
#xs text{font-family:var(--f-sans)}
#xs text:not([fill]){fill:var(--ink)}
#xs .num{font-family:var(--f-mono)}
.layer{transition:opacity .7s ease,transform .8s cubic-bezier(.2,.8,.2,1);transform-box:fill-box}
.off{opacity:0}
#L-sub.off{transform:translateY(60px)}
#L-ox.off{transform:translateY(-40px)}
#L-gate.off{transform:translateY(-120px)}
#L-ch,#tags,#field,#mos,#L-ghost{transition:opacity .6s ease}
#xs.sym #L-sub,#xs.sym #L-n,#xs.sym #L-ox,#xs.sym #L-gate,#xs.sym #L-ch,#xs.sym #tags,#xs.sym #field,#xs.sym #mos{opacity:0!important}
#xs.ana #L-sub,#xs.ana #L-n,#xs.ana #L-ox,#xs.ana #L-gate,#xs.ana #L-ch,#xs.ana #tags,#xs.ana #mos{opacity:0!important}
#analogy{position:absolute;left:60px;top:192px;width:1696px;height:1060px;opacity:0;transition:opacity .7s ease;pointer-events:none}
#analogy.on{opacity:1}
#analogy img{position:absolute;inset:0;width:100%;height:100%;border-radius:14px;display:block}
#analogy svg{position:absolute;inset:0;width:100%;height:100%}
#analogy text{font-family:var(--f-sans)}
#analogy .lab{opacity:0;transition:opacity .6s ease}
#analogy.on .lab{opacity:1}
#analogy.on .l1{transition-delay:.8s}#analogy.on .l2{transition-delay:1.6s}#analogy.on .l3{transition-delay:2.4s}
#symbol{opacity:0;transition:opacity .3s ease;pointer-events:none}
#xs.sym #symbol{opacity:1}
#symbol .spin{transform:var(--from);transition:transform 1.4s cubic-bezier(.6,0,.2,1)}
#xs.sym #symbol .spin{transform:translate(0px,0px)}
#symbol .wire{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s ease 1.2s}
#xs.sym #symbol .wire{stroke-dashoffset:0}
#symbol .late{opacity:0;transition:opacity .6s ease 2.1s}
#xs.sym #symbol .late{opacity:1}
.fade{transition:opacity .5s ease}

/* Rechte Spalte */
#panel{position:absolute;left:2010px;top:150px;width:1120px;height:1040px;display:flex;flex-direction:column;gap:26px}
#stepNo{font-family:var(--f-mono);font-size:30px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
#stepTitle{margin:0;font-size:68px;font-weight:600;line-height:1.08;text-wrap:balance}
#stepText{margin:0;font-size:41px;line-height:1.36;color:var(--ink);max-width:1100px}
#stepText.big{font-size:56px;line-height:1.25;font-weight:500}
#txt{display:flex;flex-direction:column;gap:22px;transition:opacity .25s ease}
#txt.swap{opacity:0}
#readout{display:flex;gap:46px;font-family:var(--f-mono);font-size:44px;font-weight:600;border-top:3px solid var(--rule);padding-top:20px;transition:opacity .5s ease}
#readout .k{color:var(--muted);font-weight:400}
#readout .v-i{color:var(--accent)}
#readout sub,#stepText sub,#stepTitle sub,.ctl sub{font-size:.68em}
#charts{flex:1;min-height:0;display:flex;flex-direction:column;gap:18px;transition:opacity .5s ease}
#charts svg{flex:1;min-height:0;width:100%;display:block}
#charts text{font-family:var(--f-sans)}
#charts text:not([fill]){fill:var(--ink)}
#charts .num{font-family:var(--f-mono);fill:var(--muted)}

/* Regler im Interaktiv-Modus */
#controls{display:flex;flex-direction:column;gap:18px}
.ctl{display:grid;grid-template-columns:200px 1fr 220px;align-items:center;gap:24px;font-size:42px}
.ctl output{font-family:var(--f-mono);font-weight:600;text-align:right}
.ctl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:7px;background:var(--rule);outline:none}
.ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:52px;height:52px;border-radius:50%;background:var(--accent);border:6px solid var(--paper);box-shadow:0 0 0 3px var(--accent);cursor:pointer}
.ctl input[type=range]::-moz-range-thumb{width:44px;height:44px;border-radius:50%;background:var(--accent);border:6px solid var(--paper);cursor:pointer}
.ctl input[type=range]:focus-visible{box-shadow:0 0 0 4px var(--ink)}

#black{position:fixed;inset:0;background:#000;z-index:10}
@media (prefers-reduced-motion:reduce){.layer,.fade,#txt,#charts,#readout{transition:none}}
</style>

</head><body>
<div id="viewport">
 <div id="stage">
  <div id="head">
   <div class="eyebrow">Der Feldeffekttransistor · Aufbau und Funktion</div>
   <h1>n-type MOSFET</h1>
  </div>

  <svg id="xs" viewBox="0 0 1900 1100" aria-label="Querschnitt eines n-Typ-MOSFET">
   <defs>
    <g id="sym-hole"><circle r="14" fill="#fff" stroke="var(--hole)" stroke-width="4"/><rect x="-7" y="-2" width="14" height="4" fill="var(--hole)"/><rect x="-2" y="-7" width="4" height="14" fill="var(--hole)"/></g>
    <g id="sym-el"><circle r="12" fill="var(--electron)"/><rect x="-6" y="-1.7" width="12" height="3.4" fill="#fff"/></g>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
    <marker id="arrE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--electron)"/></marker>
   </defs>

   <g id="L-ghost" class="layer">
    <rect x="120" y="380" width="1660" height="620" fill="none" stroke="var(--rule)" stroke-width="4" stroke-dasharray="18 14" rx="6"/>
   </g>

   <!-- p-Substrat mit Body-Anschluss -->
   <g id="L-sub" class="layer off">
    <line x1="950" y1="1000" x2="950" y2="1040" stroke="var(--ink)" stroke-width="5"/>
    <circle cx="950" cy="1066" r="26" fill="var(--pin)" stroke="var(--ink)" stroke-width="4"/>
    <text x="996" y="1084" font-size="54" font-weight="500">Body</text>

    <text x="1700" y="975" text-anchor="end" font-size="60" font-weight="600">p-Si</text>
   </g>

   <!-- n+ Source/Drain mit Anschlüssen -->
   <g id="L-n" class="layer off">

    <path d="M1780 520 H1355 C1352 610 1380 690 1520 705 L1780 705 Z" fill="var(--nplus)" stroke="var(--ink)" stroke-width="4"/>
    <g id="nel"></g>
    <text x="190" y="672" font-size="56" font-weight="600">n⁺</text>
    <text x="1710" y="672" text-anchor="end" font-size="56" font-weight="600">n⁺</text>
   </g>

   <g id="L-ch">
    <path id="chpoly" d="" fill="var(--nplus)" opacity=".9"/>
    <g id="chel"></g>
    <g id="pinch" class="fade" opacity="0">
     <line id="pinchLine" x1="0" y1="535" x2="0" y2="600" stroke="var(--ink)" stroke-width="3"/>
     <text id="pinchText" x="0" y="600" text-anchor="end" font-size="36" font-weight="500">Abschnürpunkt</text>
    </g>
   </g>

   <g id="L-ox" class="layer off">
    <rect x="470" y="470" width="960" height="50" fill="var(--oxide)" stroke="var(--ink)" stroke-width="4"/>
    <text id="oxLabel" class="fade" x="950" y="507" text-anchor="middle" font-size="32" font-weight="500">Gateoxid SiO₂</text>
   </g>

   <!-- Gate mit Anschluss -->
   <g id="L-gate" class="layer off">
    <line x1="950" y1="380" x2="950" y2="182" stroke="var(--ink)" stroke-width="5"/>
    <circle cx="950" cy="156" r="26" fill="var(--pin)" stroke="var(--ink)" stroke-width="4"/>
    <text x="950" y="102" text-anchor="middle" font-size="54" font-weight="500">Gate</text>
    <rect x="470" y="380" width="960" height="90" fill="var(--metal)" stroke="var(--ink)" stroke-width="4"/>
    <g id="gcharge"></g>
   </g>

   <!-- Elektrisches Feld (nur im Feld-Schritt), quer über die Grenzflächen -->
   <g id="field" class="fade" opacity="0"></g>

   <!-- Begriff MOS (nur im Gate-Schritt) -->
   <g id="mos" class="fade" opacity="0">
    <text x="500" y="442" font-size="44" fill="#fff"><tspan font-weight="700" fill="var(--pin)">M</tspan>etall</text>
    <text x="500" y="508" font-size="34" font-weight="500"><tspan font-weight="700" fill="var(--accent)">O</tspan>xid (SiO₂)</text>
    <rect x="585" y="562" width="730" height="72" rx="10" fill="var(--paper)" opacity=".92"/>
    <text x="610" y="612" font-size="44"><tspan font-weight="700" fill="var(--accent)">S</tspan>emiconductor (Halbleiter)</text>
   </g>

   <!-- Spannungen und Strom -->
   <g id="tags">
    <text id="tagUgs" class="num fade" x="985" y="262" font-size="46" font-weight="600" fill="var(--accent)" opacity="0"></text>
    <text id="tagUds" class="num fade" x="1572" y="340" text-anchor="end" font-size="46" font-weight="600" fill="var(--accent)" opacity="0"></text>
    <g id="eArrow" class="fade" opacity="0">
     <line x1="640" y1="592" x2="930" y2="592" stroke="var(--electron)" stroke-width="7" marker-end="url(#arrE)"/>

    </g>
    <g id="idArrow" class="fade" opacity="0">
     <line x1="1640" y1="290" x2="1640" y2="400" stroke="var(--accent)" stroke-width="8" marker-end="url(#arr)"/>
     <text x="1672" y="362" font-size="48" font-weight="600" fill="var(--accent)">I<tspan dy="10" font-size="34">D</tspan></text>
    </g>
   </g>
   <!-- Schaltzeichen n-Kanal-MOSFET (Anreicherung, 4 Anschlüsse) -->
   <g id="symbol" stroke="var(--ink)" stroke-width="9" stroke-linecap="round" fill="none">

    <path class="wire" pathLength="1" d="M900 460 H1100 V300"/>
    <path class="wire" pathLength="1" d="M900 740 H1100 V900"/>
    <path class="wire" pathLength="1" d="M900 600 H1240"/>
    <polygon class="late" points="912,600 972,574 972,626" fill="var(--ink)" stroke="none"/>
    <g class="spin" style="--from:translate(390px,-444px)" stroke="none"><circle cx="560" cy="600" r="26" fill="var(--pin)" stroke="var(--ink)" stroke-width="4"/><text x="512" y="618" text-anchor="end" font-size="54" font-weight="500" fill="var(--ink)">Gate</text></g>
    <g class="spin" style="--from:translate(500px,-38px)" stroke="none"><circle cx="1100" cy="274" r="26" fill="var(--pin)" stroke="var(--ink)" stroke-width="4"/><text x="1146" y="292" font-size="54" font-weight="500" fill="var(--ink)">Drain</text></g>
    <g class="spin" style="--from:translate(-800px,-690px)" stroke="none"><circle cx="1100" cy="926" r="26" fill="var(--pin)" stroke="var(--ink)" stroke-width="4"/><text x="1146" y="944" font-size="54" font-weight="500" fill="var(--ink)">Source</text></g>
    <g class="spin" style="--from:translate(-316px,466px)" stroke="none"><circle cx="1266" cy="600" r="26" fill="var(--pin)" stroke="var(--ink)" stroke-width="4"/><text x="1312" y="618" font-size="54" font-weight="500" fill="var(--ink)">Body</text></g>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=rng(11);
const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=(v,d=1)=>(Math.abs(v)<Math.pow(10,-d)/2?0:v).toFixed(d).replace(".",",");

/* ---------- Physik (Modellwerte wie in der Übungsaufgabe) ---------- */
const K=20, UTH=1.5;            // K = µn·C'ox·W/L in mA/V², Schwellspannung in V
function Id(ugs,uds){const v=ugs-UTH;if(v<=0||uds<=0)return 0;if(uds<v)return K*(v*uds-uds*uds/2);return K/2*v*v*(1+0.04*(uds-v));}

/* ---------- Geometrie ---------- */
const GX0=470,GX1=1430,CX0=530,CX1=1370,CL=CX1-CX0,SY=520,WMAX=190;
const inN=(x,y)=>(x<575&&y<725)||(x>1325&&y<725);
const inLabel=(x,y)=>(x>1540&&x<1730&&y>900)||(x>165&&x<275&&y>612&&y<700)||(x>1625&&x<1735&&y>612&&y<700);

/* Teilchen erzeugen (mit Mindestabstand) */
const pts=[];
function place(n,gen,minD){const out=[];let guard=0;while(out.length<n&&guard++<20000){const p=gen();if(!p)continue;if(pts.some(q=>(q.x-p.x)**2+(q.y-p.y)**2<minD*minD))continue;pts.push(p);out.push(p);}return out;}
const holes=place(46,()=>{const x=150+R()*1600,y=545+R()*430;return inN(x,y)||inLabel(x,y)?null:{x,y};},70).map(p=>({bx:p.x,by:p.y,ph:R()*6.283,n:null}));
const nel=[...place(24,()=>{const x=150+R()*320,y=545+R()*130;return inLabel(x,y)?null:{x,y};},36),...place(24,()=>{const x=1430+R()*320,y=545+R()*130;return inLabel(x,y)?null:{x,y};},36)].map(p=>({x:p.x,y:p.y,ph:R()*6.283,n:null}));
const NCH=44;const chel=[];for(let i=0;i<NCH;i++)chel.push({u:(i+R()*0.8)/NCH,v:R(),n:null});

holes.forEach(h=>h.n=el("use",{href:"#sym-hole"},$("holes")));
nel.forEach(e=>e.n=el("use",{href:"#sym-el"},$("nel")));
chel.forEach(e=>e.n=el("use",{href:"#sym-el"},$("chel")));

/* Feldpfeile: vom Gate durch das Oxid bis ins Silizium */
for(let i=0;i<7;i++){const x=545+i*135;if(i===3)continue;
 el("line",{x1:x,y1:476,x2:x,y2:700,stroke:"var(--accent)","stroke-width":7,"marker-end":"url(#arr)"},$("field"));}
el("line",{x1:950,y1:476,x2:950,y2:640,stroke:"var(--accent)","stroke-width":7,"marker-end":"url(#arr)"},$("field"));
el("text",{x:950,y:700,"text-anchor":"middle","font-size":44,"font-weight":600,fill:"var(--accent)"},$("field")).textContent="E";

/* ---------- Schritte ----------
   ugs: angelegte Gatespannung; freeze: Ladungsträger reagieren noch nicht (Feld-Schritt) */
const S=(sub,n,ox,gate)=>({sub,n,ox,gate});
const ALL=S(1,1,1,1);
const steps=[
 {t:"Wir bauen einen Transistor",x:"Schicht für Schicht, vom Siliziumkristall bis zu den vier Anschlüssen.",show:S(0,0,0,0),ugs:0,uds:0,chart:"none"},
 {t:"Das p-Substrat",x:"Silizium, mit Akzeptoren dotiert. Freie Löcher (⊕) sind die Majoritätsträger. Der Body-Anschluss kontaktiert das Substrat.",show:S(1,0,0,0),ugs:0,uds:0,chart:"none"},
 {t:"Source und Drain",x:"Zwei stark n-dotierte Inseln (n⁺) voller freier Elektronen, jede mit eigenem Anschluss. Source ist der Bezugspunkt (0 V), der Body liegt ebenfalls auf 0 V. Dazwischen sperren zwei gegeneinander geschaltete pn-Übergänge.",show:S(1,1,0,0),ugs:0,uds:0,chart:"none"},
 {t:"Das Gateoxid",x:"Eine Isolierschicht aus SiO₂, nur wenige Nanometer dick. Hier ist sie stark überhöht gezeichnet.",show:S(1,1,1,0),ugs:0,uds:0,chart:"none"},
 {t:"Metall, Oxid, Halbleiter",x:"Auf dem Oxid sitzt die Gate-Elektrode. Die Schichtfolge <b>M</b>etall, <b>O</b>xid, <b>S</b>emiconductor gibt dem MOSFET seinen Namen. Gate, Oxid und Silizium bilden einen Plattenkondensator.",show:ALL,ugs:0,uds:0,chart:"none",mos:true},
 {t:"Source, Drain und Gate",x:"Ein Wasserhahn als Bild: Aus der <b>Source</b> (Quelle) kommt das Wasser, in den <b>Drain</b> (Abfluss) fließt es ab. Das <b>Gate</b> (Schleuse) ist der Hebel: Es steuert, wie viel fließt, ohne selbst Wasser zu führen.",show:ALL,ugs:0,uds:0,chart:"none",analogy:true},
 {t:"Frage an Sie",x:"Ich lege eine positive Spannung ans Gate. Zwischen Drain und Source liegt noch nichts an (U<sub>DS</sub> = 0). Was passiert im Silizium unter dem Gate?",big:true,show:ALL,ugs:0,uds:0,chart:"none",tagQ:true},
 {t:"Das elektrische Feld",x:"Wie im Plattenkondensator sammelt sich positive Ladung auf dem Gate. Das Feld reicht durch das Oxid hindurch bis ins Silizium.",show:ALL,ugs:1.0,uds:0,chart:"none",freeze:true,field:true},
 {t:"Verarmung: U<sub>GS</sub> &lt; U<sub>th</sub>",x:"Das Feld drängt die Löcher von der Oberfläche weg. Zurück bleibt eine Raumladungszone ohne freie Ladungsträger. Noch gibt es keinen Kanal.",show:ALL,ugs:1.0,uds:0,chart:"charge"},
 {t:"Inversion: U<sub>GS</sub> &gt; U<sub>th</sub>",x:"Ab der Schwellspannung sammeln sich an der Oberfläche mehr Elektronen als Löcher. Ein dünner n-Kanal verbindet Source und Drain. Solange U<sub>DS</sub> = 0 ist, fließt aber noch kein Strom.",show:ALL,ugs:3.0,uds:0,chart:"charge"},
 {t:"Strom bei kleinem U<sub>DS</sub>",x:"Eine kleine Drain-Source-Spannung lässt die Elektronen durch den Kanal driften. Der Kanal wirkt wie ein Widerstand, den das Gate steuert.",show:ALL,ugs:3.0,uds:0.1,chart:"transfer"},
 {t:"Abschnürung bei großem U<sub>DS</sub>",x:"Am Drain-Ende ist die Spannung zwischen Gate und Kanal kleiner, dort wird der Kanal dünner. Ab <span class='nw'>U<sub>DS</sub> = U<sub>GS</sub> − U<sub>th</sub></span> schnürt er ab und der Strom steigt kaum noch: Sättigung.",show:ALL,ugs:3.0,uds:2.5,chart:"output"},
 {t:"Selbst ausprobieren",x:"Kanal, Raumladungszone und Arbeitspunkt folgen den Reglern live.",show:ALL,ugs:3.0,uds:0.1,chart:"output",interactive:true},
 {t:"Das Schaltzeichen",x:"Der gestrichelte Kanal steht für „selbstsperrend“ (Anreicherungstyp): ohne Gatespannung kein Kanal. Der Pfeil am Body zeigt zum Kanal hin, das kennzeichnet den n-Kanal.",show:ALL,ugs:0,uds:0,chart:"none",symbol:true}
];

let idx=0, band=false;
const cur={ugs:0,uds:0,resp:0}, tgt={ugs:0,uds:0,resp:0};

function setStep(i,instant,back){
 idx=clamp(i,0,steps.length-1);const s=steps[idx];
 $("xs").classList.toggle("sym",!!s.symbol);$("xs").classList.toggle("ana",!!s.analogy);$("analogy").classList.toggle("on",!!s.analogy);
 const L={sub:"L-sub",n:"L-n",ox:"L-ox",gate:"L-gate"};
 for(const k in L)$(L[k]).classList.toggle("off",!s.show[k]);
 $("L-ghost").classList.toggle("off",idx>=4);
 const txt=$("txt");
 const apply=()=>{
  $("stepNo").textContent=idx===0?"Hauptanimation":`Schritt ${idx} von ${steps.length-1}`;
  $("stepTitle").innerHTML=s.t;$("stepText").innerHTML=s.x;$("stepText").classList.toggle("big",!!s.big);
  txt.classList.remove("swap");
 };
 if(instant||reduce)apply();else{txt.classList.add("swap");setTimeout(apply,230);}
 tgt.ugs=s.ugs;tgt.uds=s.uds;tgt.resp=s.freeze?0:s.ugs;
 if(s.interactive){$("ugs").value=s.ugs;$("uds").value=s.uds;$("ugsOut").textContent=fmt(s.ugs)+" V";$("udsOut").textContent=fmt(s.uds,1)+" V";}
 $("controls").hidden=!s.interactive;
 $("field").setAttribute("opacity",s.field?1:0);
 $("mos").setAttribute("opacity",s.mos?1:0);
 $("readout").style.opacity=idx>=7&&!s.symbol?1:0;
 $("charts").style.opacity=chartIdFor(idx)?1:0;
 const nid=chartIdFor(idx);
 if(nid!==chartId){chartId=nid;const now=performance.now();
  if(back||instant){cstage=2;tS=[now-9999,-1e9,-1e9];}else{cstage=0;tS=[now,0,0];}}
 lastKey="";
}

/* ---------- Diagramme ---------- */
function sub(main,s,rest){return `${main}<tspan dy="0.28em" font-size="0.7em">${s}</tspan><tspan dy="-0.28em">${rest||""}</tspan>`;}
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v*1.12)));for(const m of [1,1.5,2,2.5,3,4,5,6,8,10])if(m*e>=v*1.12)return m*e;return 10*e;}
function frame(svg){const w=svg.clientWidth||1100,h=svg.clientHeight||500;svg.setAttribute("viewBox",`0 0 ${w} ${h}`);return {w,h};}
function axes(svg,w,h,o){
 const m={l:140,r:40,t:84,b:100};const X=v=>m.l+(v-o.x0)/(o.x1-o.x0)*(w-m.l-m.r);const Y=v=>h-m.b-v/o.y1*(h-m.t-m.b);
 let s=`<text x="0" y="46" font-size="44" font-weight="600">${o.title}</text>`;
 for(let v=o.x0;v<=o.x1+1e-9;v+=o.xs){s+=`<line x1="${X(v)}" y1="${m.t}" x2="${X(v)}" y2="${h-m.b}" stroke="var(--rule)" stroke-width="1.5"/><text class="num" x="${X(v)}" y="${h-m.b+46}" font-size="36" text-anchor="middle">${fmt(v,o.xs<1?1:0)}</text>`;}
 if(o.yt){const nt=[5,4,3,2].find(n=>{const st=o.y1/n,e=Math.pow(10,Math.floor(Math.log10(st))),f=st/e;return [1,2,2.5,5].some(q=>Math.abs(q-f)<1e-6);})||4;
  for(let k=0;k<=nt;k++){const v=o.y1*k/nt;s+=`<line x1="${m.l}" y1="${Y(v)}" x2="${w-m.r}" y2="${Y(v)}" stroke="var(--rule)" stroke-width="1.5"/><text class="num" x="${m.l-16}" y="${Y(v)+12}" font-size="36" text-anchor="end">${fmt(v,v%1?1:0)}</text>`;}}
 s+=`<line x1="${m.l}" y1="${h-m.b}" x2="${w-m.r}" y2="${h-m.b}" stroke="var(--ink)" stroke-width="3"/><line x1="${m.l}" y1="${m.t}" x2="${m.l}" y2="${h-m.b}" stroke="var(--ink)" stroke-width="3"/>`;
 s+=`<text x="${w-m.r}" y="${h-6}" font-size="40" text-anchor="end">${o.xl}</text>`;
 s+=`<text x="${m.l+14}" y="${m.t+38}" font-size="40">${o.yl}</text>`;
 return {s,X,Y,m};
}
function path(f,X,Y,a,b,n){let d="";for(let i=0;i<=n;i++){const v=a+(b-a)*i/n;d+=(i?"L":"M")+X(v).toFixed(1)+" "+Y(f(v)).toFixed(1);}return d;}
const uth=(a,h)=>`<line x1="${a.X(UTH)}" y1="${a.m.t}" x2="${a.X(UTH)}" y2="${h-a.m.b}" stroke="var(--muted)" stroke-width="3" stroke-dasharray="10 8"/><text x="${a.X(UTH)+14}" y="${a.m.t+40}" font-size="40">${sub("U","th","")}</text>`;
function chartCharge(w,h,ugs){
 const a=axes(null,w,h,{x0:0,x1:5,xs:1,y1:4,title:"Elektronen im Kanal pro Fläche",xl:sub("U","GS"," in V"),yl:"|"+sub("Q′","n","|")});
 const line=`<path d="${path(v=>Math.max(0,v-UTH),a.X,a.Y,0,5,100)}" fill="none" stroke="var(--electron)" stroke-width="6"/>`;
 let ann=uth(a,h);
 ann+=`<text x="${a.X(4.95)}" y="${a.Y(0.75)}" font-size="40" text-anchor="end">|${sub("Q′","n","|")} = C′<tspan dy="0.28em" font-size="0.7em">ox</tspan><tspan dy="-0.28em">·(U</tspan><tspan dy="0.28em" font-size="0.7em">GS</tspan><tspan dy="-0.28em"> − U</tspan><tspan dy="0.28em" font-size="0.7em">th</tspan><tspan dy="-0.28em">)</tspan></text>`;
 ann+=`<circle cx="${a.X(clamp(ugs,0,5))}" cy="${a.Y(Math.max(0,ugs-UTH))}" r="16" fill="var(--accent)" stroke="var(--paper)" stroke-width="5"/>`;
 return {ax:a.s,line,ann};
}
function chartTransfer(w,h,ugs,uds){
 const ud=Math.max(uds,0.1);const y1=niceMax(Id(5,ud));
 const a=axes(null,w,h,{x0:0,x1:5,xs:1,y1,yt:1,title:`Transferkennlinie bei U<tspan dy="0.28em" font-size="0.7em">DS</tspan><tspan dy="-0.28em"> = ${fmt(ud,1)} V</tspan>`,xl:sub("U","GS"," in V"),yl:sub("I","D"," in mA")});
 const line=`<path d="${path(v=>Id(v,ud),a.X,a.Y,0,5,120)}" fill="none" stroke="var(--electron)" stroke-width="6"/>`;
 let ann=uth(a,h);
 ann+=`<text x="${a.X(5)}" y="${a.Y(0)-18}" font-size="34" text-anchor="end">I<tspan dy="0.28em" font-size="0.7em">D</tspan><tspan dy="-0.28em"> ≈ µ</tspan><tspan dy="0.28em" font-size="0.7em">n</tspan><tspan dy="-0.28em">C′</tspan><tspan dy="0.28em" font-size="0.7em">ox</tspan><tspan dy="-0.28em">·(W/L)·(U</tspan><tspan dy="0.28em" font-size="0.7em">GS</tspan><tspan dy="-0.28em"> − U</tspan><tspan dy="0.28em" font-size="0.7em">th</tspan><tspan dy="-0.28em">)·U</tspan><tspan dy="0.28em" font-size="0.7em">DS</tspan></text>`;
 ann+=`<circle cx="${a.X(clamp(ugs,0,5))}" cy="${a.Y(Math.min(Id(ugs,ud),y1))}" r="16" fill="var(--accent)" stroke="var(--paper)" stroke-width="5"/>`;
 return {ax:a.s,line,ann};
}
function chartOutput(w,h,ugs,uds){
 const fam=[2,2.5,3,3.5];const top=Math.max(3.5,ugs);const y1=niceMax(Id(top,3));
 const a=axes(null,w,h,{x0:0,x1:3,xs:0.5,y1,yt:1,title:"Ausgangskennlinienfeld",xl:sub("U","DS"," in V"),yl:sub("I","D"," in mA")});
 let line=`<path d="${path(v=>K/2*v*v,a.X,a.Y,0,Math.min(3,Math.sqrt(2*y1/K)),60)}" fill="none" stroke="var(--muted)" stroke-width="3" stroke-dasharray="10 8"/>`;
 let ann="";
 fam.forEach(g=>{line+=`<path d="${path(v=>Id(g,v),a.X,a.Y,0,3,90)}" fill="none" stroke="var(--rule)" stroke-width="4"/>`;if(h>380)ann+=`<text class="num" x="${a.X(3)-6}" y="${a.Y(Id(g,3))-12}" font-size="32" text-anchor="end">${fmt(g)} V</text>`;});
 line+=`<path d="${path(v=>Id(ugs,v),a.X,a.Y,0,3,90)}" fill="none" stroke="var(--electron)" stroke-width="6"/>`;
 ann+=`<text x="${a.X(0.1)}" y="${a.Y(y1*0.6)}" font-size="38" fill="var(--muted)">linear</text><text x="${a.X(1.9)}" y="${a.Y(y1*0.92)}" font-size="38" fill="var(--muted)">Sättigung</text>`;
 ann+=`<circle cx="${a.X(clamp(uds,0,3))}" cy="${a.Y(Math.min(Id(ugs,uds),y1))}" r="16" fill="var(--accent)" stroke="var(--paper)" stroke-width="5"/>`;
 return {ax:a.s,line,ann};
}
function psiS(ugs){if(ugs<=0)return -0.12*Math.min(1,-ugs);if(ugs<UTH)return 0.7*ugs/UTH;return 0.7+0.04*Math.log(1+(ugs-UTH)*4);}
function chartBand(w,h,ugs){
 const l=130,r=160,t=80,b=80,ox=60;const x0=l+ox,x1=w-r;
 const ps=psiS(ugs);const Wd=ps>0?(x1-x0)*0.55*Math.sqrt(clamp(ps/0.75,0,1)):(x1-x0)*0.12;
 const E0=0.9,E1=-1.05;const Y=E=>t+(E0-E)/(E0-E1)*(h-t-b);
 const psi=x=>{const d=x-x0;return d<Wd?ps*(1-d/Wd)**2:0;};
 const bl=off=>{let d="";for(let i=0;i<=120;i++){const x=x0+(x1-x0)*i/120;d+=(i?"L":"M")+x.toFixed(1)+" "+Y(off-psi(x)).toFixed(1);}return d;};
 let ax=`<text x="0" y="46" font-size="44" font-weight="600">Bänderdiagramm unter dem Gate</text>`;
 if(ps>0.02)ax+=`<rect x="${x0}" y="${t}" width="${Wd}" height="${h-t-b}" fill="var(--p-depl)"/><text x="${x0+Wd/2}" y="${h-b+46}" font-size="34" text-anchor="middle" fill="var(--muted)">Raumladungszone</text>`;
 ax+=`<rect x="${l}" y="${t}" width="${ox}" height="${h-t-b}" fill="var(--oxide)" stroke="var(--ink)" stroke-width="2"/><text x="${l+ox/2}" y="${h-b+46}" font-size="34" text-anchor="middle">Oxid</text>`;
 ax+=`<text x="${x1}" y="${h-b+46}" font-size="34" text-anchor="end" fill="var(--muted)">Tiefe →</text>`;
 let line=`<path d="${bl(0.56)}" fill="none" stroke="var(--ink)" stroke-width="5"/><path d="${bl(-0.56)}" fill="none" stroke="var(--ink)" stroke-width="5"/>`;
 line+=`<path d="${bl(0)}" fill="none" stroke="var(--muted)" stroke-width="3" stroke-dasharray="10 8"/>`;
 line+=`<line x1="${x0}" y1="${Y(-0.35)}" x2="${x1}" y2="${Y(-0.35)}" stroke="var(--accent)" stroke-width="4" stroke-dasharray="14 8"/>`;
 const lab=(E,a,c)=>`<text x="${x1+16}" y="${Y(E)+13}" font-size="40" fill="${c||"var(--ink)"}">E<tspan dy="0.28em" font-size="0.7em">${a}</tspan></text>`;
 let ann=`<text class="num" x="${w-10}" y="46" font-size="36" text-anchor="end">ψ<tspan dy="0.28em" font-size="0.7em">s</tspan><tspan dy="-0.28em"> = ${fmt(ps,2)} V</tspan></text>`;
 ann+=lab(0.56,"C")+lab(0.02,"i","var(--muted)")+lab(-0.35,"F","var(--accent)")+lab(-0.62,"V");
 const inv=clamp((ps-0.4)/0.3,0,1);const ne=Math.round(inv*6);
 for(let k=0;k<ne;k++){const x=x0+10+k*18;ann+=`<circle cx="${x}" cy="${Y(0.56-psi(x))+18}" r="9" fill="var(--electron)"/>`;}
 if(ne)ann+=`<text x="${x0+14}" y="${Y(0.56-ps)+80}" font-size="34" fill="var(--electron)">Inversion</text>`;
 for(let k=0;k<8;k++){const x=x0+Wd+40+k*((x1-x0-Wd-60)/8);if(x>x1-10)break;ann+=`<circle cx="${x}" cy="${Y(-0.56-psi(x))+18}" r="9" fill="#fff" stroke="var(--hole)" stroke-width="3"/>`;}
 return {ax,line,ann};
}
/* Diagramme bauen sich auf: Achsen, dann Kurven (von links gezeichnet), dann Formeln/Markierungen */
/* Klickweise: Stufe 0 Achsen, Stufe 1 Kurven (von links gezeichnet), Stufe 2 Formeln/Markierungen */
let lastKey="",chartId=null,cstage=2,tS=[0,-1e9,-1e9];
function chartIdFor(i){const s=steps[i];if(s.symbol)return null;if(band&&i>=1)return "band";return s.chart==="none"?null:s.chart;}
function renderCharts(now){
 const id=chartIdFor(idx);if(!id)return;const c1=$("ch1");
 const ease=x=>1-Math.pow(1-x,3);
 const o0=reduce?1:clamp((now-tS[0])/800,0,1);
 const o1=cstage<1?0:reduce?1:clamp((now-tS[1])/2200,0,1);
 const o2=cstage<2?0:reduce?1:clamp((now-tS[2])/1000,0,1);
 const key=[id,cstage,cur.resp.toFixed(2),cur.uds.toFixed(2),o0.toFixed(2),o1.toFixed(3),o2.toFixed(2)].join("|");
 if(key===lastKey)return;lastKey=key;
 const {w,h}=frame(c1);const u=cur.resp;
 const r=id==="band"?chartBand(w,h,u):id==="charge"?chartCharge(w,h,u):id==="transfer"?chartTransfer(w,h,u,cur.uds):chartOutput(w,h,u,cur.uds);
 c1.innerHTML=`<defs><clipPath id="clipL"><rect x="0" y="0" width="${(w*ease(o1)).toFixed(1)}" height="${h}"/></clipPath></defs><g opacity="${o0.toFixed(2)}">${r.ax}</g><g clip-path="url(#clipL)">${r.line}</g><g opacity="${o2.toFixed(2)}">${r.ann}</g>`;
}

/* ---------- Animation ---------- */
let gCount=-99;
function gateCharges(ugs){
 const n=Math.round(clamp(Math.abs(ugs)*3,0,15))*(ugs<0?-1:1);if(n===gCount)return;gCount=n;
 const g=$("gcharge");g.innerHTML="";const m=Math.abs(n);
 for(let i=0;i<m;i++){const x=GX0+40+(GX1-GX0-80)*(m===1?0.5:i/(m-1));el("text",{x,y:462,"text-anchor":"middle","font-size":54,"font-weight":700,fill:"var(--pin)"},g).textContent=n>0?"+":"−";}
}
let tPrev=performance.now();
function tick(now){
 const dt=Math.min(0.05,(now-tPrev)/1000);tPrev=now;const T=now/1000;
 const k=reduce?1:Math.min(1,dt*2.4);
 for(const q of ["ugs","uds","resp"]){cur[q]+=(tgt[q]-cur[q])*k;if(Math.abs(tgt[q]-cur[q])<1e-3)cur[q]=tgt[q];}
 const ugs=cur.ugs,uds=cur.uds,ur=cur.resp,wob=reduce?0:1;

 // Raumladungszone (folgt der "wirksamen" Gatespannung)
 const Wd=WMAX*Math.sqrt(clamp(ur/UTH,0,1));
 $("depl").setAttribute("d",Wd>1?`M${GX0} ${SY} H${GX1} V${SY+Wd*0.8} Q${GX1} ${SY+Wd} ${GX1-80} ${SY+Wd} H${GX0+80} Q${GX0} ${SY+Wd} ${GX0} ${SY+Wd*0.8} Z`:"");
 const dl=$("deplLabel");dl.setAttribute("y",SY+Wd-18);dl.setAttribute("opacity",Wd>120?1:0);

 // Löcher
 const acc=ur<0?Math.min(1,-ur/1.5):0;
 for(const h of holes){
  const w=clamp((h.bx-GX0)/70,0,1)*clamp((GX1-h.bx)/70,0,1);let y=h.by;
  if(Wd>0&&w>0){const top=SY+Wd*w;y=top+18+(h.by-545)*(985-top-18)/440;}
  else if(acc>0&&w>0){y=545+(h.by-545)*(1-0.55*acc*w);}
  h.n.setAttribute("transform",`translate(${(h.bx+wob*2*Math.sin(T*1.7+h.ph)).toFixed(1)} ${(y+wob*2*Math.cos(T*1.3+h.ph)).toFixed(1)})`);
 }
 for(const e of nel)e.n.setAttribute("transform",`translate(${(e.x+wob*2*Math.sin(T*1.5+e.ph)).toFixed(1)} ${(e.y+wob*2*Math.cos(T*1.9+e.ph)).toFixed(1)})`);

 // Kanal
 const vov=ur-UTH;const I=Id(ur,uds);
 let Leff=CL,A=0;
 if(vov>0){const Vd=Math.min(uds,vov);A=vov*Vd-Vd*Vd/2;if(uds>vov)Leff=CL*(1-0.1*clamp((uds-vov)/2,0,1));}
 const Q=u=>{if(vov<=0)return 0;const xr=u*CL;if(xr>Leff)return 0;const s=xr/Leff;const V=vov-Math.sqrt(Math.max(0,vov*vov-2*s*A));return Math.max(0,vov-V);};
 const th=q=>q>0?5+34*q/2.5:0;
 if(vov>0.01){let d=`M${CX0} ${SY}`;for(let i=0;i<=60;i++){const u=i/60;d+=` L${(CX0+u*CL).toFixed(1)} ${(SY+th(Q(u))).toFixed(1)}`;}d+=` L${CX1} ${SY} Z`;$("chpoly").setAttribute("d",d);}else $("chpoly").setAttribute("d","");
 const nVis=Math.round(NCH*clamp(vov/2.5,0,1));
 chel.forEach((e,i)=>{
  if(i>=nVis){e.n.setAttribute("opacity",0);return;}
  e.n.setAttribute("opacity",1);
  const q=Q(e.u);
  if(I>0.02&&!reduce){e.u+=dt*Math.min(2.2,0.08*Math.sqrt(I)/Math.max(q,0.2));if(e.u>=1){e.u-=1;e.v=R();}}
  const x=CX0+e.u*CL,xr=e.u*CL;const y=xr>Leff?SY+7+e.v*6:SY+6+e.v*Math.max(0,th(q)-12);
  e.n.setAttribute("transform",`translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(.8)`);
 });
 const sat=vov>0&&uds>vov+0.05;$("pinch").setAttribute("opacity",sat?1:0);
 if(sat){const px=CX0+Leff;$("pinchLine").setAttribute("x1",px);$("pinchLine").setAttribute("x2",px);$("pinchText").setAttribute("x",px-14);}

 // Gate-Ladung, Beschriftungen
 gateCharges(ugs);
 const s=steps[idx];
 $("oxLabel").setAttribute("opacity",Math.abs(ugs)>0.05||s.mos||s.field?0:1);
 const tU=$("tagUgs"),tD=$("tagUds");
 if(s.tagQ){tU.innerHTML=`U<tspan dy="10" font-size="34">GS</tspan><tspan dy="-10"> &gt; 0 ?</tspan>`;tU.setAttribute("opacity",1);}
 else if(idx>=7){tU.innerHTML=`U<tspan dy="10" font-size="34">GS</tspan><tspan dy="-10"> = ${fmt(ugs)} V</tspan>`;tU.setAttribute("opacity",1);}
 else tU.setAttribute("opacity",0);
 if(idx>=6){tD.innerHTML=`U<tspan dy="10" font-size="34">DS</tspan><tspan dy="-10"> = ${uds<0.005?"0":fmt(uds,1)} V</tspan>`;tD.setAttribute("opacity",1);}else tD.setAttribute("opacity",0);
 $("idArrow").setAttribute("opacity",I>0.05?1:0);$("eArrow").setAttribute("opacity",I>0.05?1:0);

 // Messwerte
 $("rUgs").textContent=fmt(ugs)+" V";$("rUds").textContent=fmt(uds,1)+" V";$("rId").textContent=fmt(I)+" mA";
 renderCharts(now);
 requestAnimationFrame(tick);
}

/* ---------- Bedienung ---------- */
function next(){if(chartIdFor(idx)&&cstage<2){cstage++;tS[cstage]=performance.now();lastKey="";return;}if(idx<steps.length-1)setStep(idx+1);}
function prev(){if(idx>0)setStep(idx-1,false,true);}
function nudge(which,d){
 if(!steps[idx].interactive)return;
 const inp=$(which);inp.value=clamp(parseFloat(inp.value)+d,parseFloat(inp.min),parseFloat(inp.max));inp.dispatchEvent(new Event("input"));
}
["ugs","uds"].forEach(id=>$(id).addEventListener("input",e=>{const v=parseFloat(e.target.value);tgt[id]=v;if(id==="ugs")tgt.resp=v;$(id+"Out").textContent=fmt(v,1)+" V";}));
document.addEventListener("keydown",e=>{
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 const k=e.key;const onRange=e.target&&e.target.type==="range";
 if(!$("black").hidden&&!["b","B","."].includes(k)){$("black").hidden=true;e.preventDefault();return;}
 if(["ArrowRight","PageDown"," ","Enter"].includes(k)||(k==="ArrowDown"&&!onRange)){if(onRange&&k!=="PageDown")return;e.preventDefault();next();}
 else if(["ArrowLeft","PageUp","Backspace"].includes(k)||(k==="ArrowUp"&&!onRange)){if(onRange&&k!=="PageUp")return;e.preventDefault();prev();}
 else if(k==="e"||k==="E"){band=!band;lastKey="";setStep(idx,true);}
 else if(k==="b"||k==="B"||k==="."){$("black").hidden=!$("black").hidden;}
 else if(k==="f"||k==="F"){const d=document.documentElement;if(!document.fullscreenElement){const r=(d.requestFullscreen||d.webkitRequestFullscreen);if(r){const p=r.call(d);if(p&&p.catch)p.catch(()=>{});}}else{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}}
 else if(k==="u"||k==="U")nudge("ugs",0.1);else if(k==="j"||k==="J")nudge("ugs",-0.1);
 else if(k==="i"||k==="I")nudge("uds",0.1);else if(k==="k"||k==="K")nudge("uds",-0.1);
 else if(k==="Home")setStep(0);else if(k==="End")setStep(steps.length-1);
});
$("black").addEventListener("click",()=>{$("black").hidden=true;});
$("stage").addEventListener("click",e=>{if(e.target.closest("#controls,#nav,input,label,button"))return;next();});
let hideT;document.addEventListener("mousemove",()=>{document.body.style.cursor="";clearTimeout(hideT);hideT=setTimeout(()=>{document.body.style.cursor="none";},2500);});

function fit(){const vp=$("viewport");const w=vp.clientWidth,h=vp.clientHeight;const s=Math.min(w/3200,h/1280);$("stage").style.transform=`translate(${(w-3200*s)/2}px,${(h-1280*s)/2}px) scale(${s})`;}
window.addEventListener("resize",fit);fit();
const start=parseInt((location.hash||"").replace(/\D/g,""),10);
setStep(isNaN(start)?0:start,true);
requestAnimationFrame(t=>{tPrev=t;tick(t);});
})();
</script>

</body></html>
