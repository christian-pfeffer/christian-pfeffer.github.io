<script>
(function(){
"use strict";
const vp=document.getElementById("viewport"),black=document.getElementById("black");
const frames=[...document.querySelectorAll("script.part")].map(sc=>{
 const bytes=Uint8Array.from(atob(sc.textContent.trim()),c=>c.charCodeAt(0));
 const f=document.createElement("iframe");
 f.title=sc.dataset.name;
 f.srcdoc=new TextDecoder("utf-8").decode(bytes);
 vp.appendChild(f);return f;
});
let p=0;
const deck=i=>frames[i].contentWindow&&frames[i].contentWindow.deck;

function activate(q,where){
 const d0=deck(p);if(d0&&d0.leave)d0.leave();
 p=q;frames.forEach((f,i)=>f.classList.toggle("on",i===p));
 const d=deck(p);if(d)(where==="last"?d.last():d.first());
 frames[p].contentWindow.dispatchEvent(new Event("resize"));
}
function next(){const d=deck(p);if(d&&d.next())return;if(p<frames.length-1)activate(p+1,"first");}
function prev(){const d=deck(p);if(d&&d.prev())return;if(p>0)activate(p-1,"last");}

function key(e){
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 const k=e.key,onRange=e.target&&e.target.type==="range";
 if(!black.hidden&&!["b","B","."].includes(k)){black.hidden=true;e.preventDefault();return;}
 if(onRange&&k.startsWith("Arrow")){const d=deck(p);if(d)d.key(e);return;}
 if(["ArrowRight","PageDown"," ","Enter","ArrowDown"].includes(k)){e.preventDefault();next();}
 else if(["ArrowLeft","PageUp","Backspace","ArrowUp"].includes(k)){e.preventDefault();prev();}
 else if(k==="b"||k==="B"||k==="."){e.preventDefault();black.hidden=!black.hidden;}
 else if(k==="f"||k==="F"){const de=document.documentElement;if(!document.fullscreenElement){const r=de.requestFullscreen||de.webkitRequestFullscreen;if(r){const pr=r.call(de);if(pr&&pr.catch)pr.catch(()=>{});}}else{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}}
 else if(k==="Home"){e.preventDefault();activate(0,"first");}
 else if(k==="End"){e.preventDefault();activate(frames.length-1,"last");}
 else{const d=deck(p);if(d)d.key(e);}
}
window.deckKey=key;
window.deckNext=next;
document.addEventListener("keydown",key);
black.addEventListener("click",()=>{black.hidden=true;});

/* Start, sobald der erste Teil bereit ist */
frames[0].addEventListener("load",()=>{frames[0].classList.add("on");frames[0].contentWindow.focus();});
})();
</script>
